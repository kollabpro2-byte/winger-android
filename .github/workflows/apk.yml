name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0 platform-tools
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: winger-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/^[[:space:]]*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          echo "version=${ver}"
          test -n "$ver"
          apk="winger-${ver}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          body=$(printf '{"tag_name":"v%s","name":"Winger Android %s","body":"Winger Android %s"}' "$ver" "$ver" "$ver")
          code=$(curl -sS -o /tmp/rel.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d "$body")
          echo "create ${code}"
          cat /tmp/rel.json
          if [ "$code" != "201" ]; then
            code=$(curl -sS -o /tmp/rel.json -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${ver}")
            echo "existing ${code}"
            cat /tmp/rel.json
          fi
          test "$code" = "201" -o "$code" = "200"
          upload=$(python3 -c 'import json; print(json.load(open("/tmp/rel.json"))["upload_url"].split("{")[0])')
          curl -fS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$apk" \
            "${upload}?name=${apk}"

